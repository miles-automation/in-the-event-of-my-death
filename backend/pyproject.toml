[project]
name = "in-the-event-of-my-death"
version = "0.1.0-beta"
description = "Zero-knowledge time-locked secret delivery service"
authors = [{ name = "Rich Miles", email = "rich@ieomd.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "argon2-cffi>=23.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.1.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.6",
    "apscheduler>=3.11.0",
    "structlog>=24.0.0",
    "email-validator>=2.3.0",
    "httpx>=0.26.0",
    "aioboto3>=15.5.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "ruff>=0.1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
